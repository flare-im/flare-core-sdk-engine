[package]
name = "flare-im-core-sdk-wasm"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Flare IM Core SDK WebAssembly binding"

[lib]
name = "flare_im_core_sdk_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["production-runtime"]
local-smoke-runtime = []
production-runtime = []

[dependencies]
console_error_panic_hook = "0.1"
async-trait = "0.1"
flare-core = { workspace = true, default-features = false, features = ["wasm"] }
flare-im-core-sdk-bindings-runtime = { version = "1.0.3", path = "../shared" }
flare-im-core-sdk-storage-indexeddb = { version = "1.0.3", path = "../../storage/indexeddb" }
flare-im-core-sdk = { version = "1.0.3", path = "../.." }
flare-proto = { workspace = true }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tracing = "0.1"
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }

[package.metadata.wasm-pack.profile.release]
# -Oz + 必要特性开关：wasm-pack 内置 binaryen 对 5MB 产物可再缩 15-30%（网络+编译双收益）。
# 单调用方内联上限：-Oz 默认不限大小，raw 略小，gzip 却大很多，用户下载的是 gzip。
# 2026-11-06 同一份代码实测 raw / gzip：不设 4,977,796 / 1,913,323，60 是 4,988,322 / 1,780,196，
# 40 是 5,005,508 / 1,763,935。
wasm-opt = ["-Oz", "--one-caller-inline-max-function-size=40", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
